<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LAN//NODE - Initialize Identity</title>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #050706;
            --panel: #090c0a;
            --border: #1b3325;
            --green: #39ff88;
            --green-dark: #123d25;
            --text: #d8e7dc;
            --muted: #718078;
            --danger: #ff4d6d;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;

            font-family:
                "Courier New",
                Consolas,
                monospace;

            background:
                radial-gradient(
                    circle at center,
                    #0b1710 0%,
                    #050706 45%,
                    #020302 100%
                );

            color: var(--text);
        }

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background-image:
                linear-gradient(
                    rgba(57,255,136,0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(57,255,136,0.025) 1px,
                    transparent 1px
                );

            background-size: 40px 40px;
        }

        body::after {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(255,255,255,0.015),
                    rgba(255,255,255,0.015) 1px,
                    transparent 1px,
                    transparent 4px
                );

            opacity: 0.35;
        }

        .register-container {

            position: relative;

            width: 410px;

            max-width: calc(100% - 30px);

            padding: 32px;

            background:
                linear-gradient(
                    145deg,
                    rgba(12,20,15,0.98),
                    rgba(4,7,5,0.98)
                );

            border: 1px solid var(--border);

            box-shadow:
                0 0 0 1px rgba(57,255,136,0.025),
                0 0 35px rgba(0,255,100,0.08),
                0 25px 80px rgba(0,0,0,0.7);
        }

        .register-container::before {

            content: "";

            position: absolute;

            top: -1px;

            left: 25px;

            width: 110px;

            height: 2px;

            background: var(--green);

            box-shadow:
                0 0 12px var(--green);
        }

        .register-container::after {

            content: "IDENTITY_INIT";

            position: absolute;

            right: 15px;

            top: -9px;

            padding: 0 7px;

            font-size: 9px;

            letter-spacing: 1px;

            color: var(--green);

            background: var(--bg);
        }

        .system-label {

            color: var(--green);

            font-size: 10px;

            letter-spacing: 3px;

            margin-bottom: 13px;
        }

        .title {

            margin-bottom: 25px;
        }

        .title h1 {

            margin: 0;

            font-size: 29px;

            letter-spacing: 2px;

            color: #ecfff2;
        }

        .title h1 span {

            color: var(--green);

        }

        .title p {

            margin: 8px 0 0;

            color: var(--muted);

            font-size: 11px;

            letter-spacing: 1px;
        }

        .progress {

            height: 3px;

            width: 100%;

            margin: 20px 0 25px;

            background: #0c160f;

            overflow: hidden;
        }

        .progress span {

            display: block;

            width: 38%;

            height: 100%;

            background: var(--green);

            box-shadow:
                0 0 10px var(--green);

            animation:
                progressMove 3s infinite alternate;
        }

        @keyframes progressMove {

            from {
                width: 25%;
            }

            to {
                width: 75%;
            }

        }

        label {

            display: block;

            margin-bottom: 7px;

            color: #8ea095;

            font-size: 10px;

            letter-spacing: 1px;

            text-transform: uppercase;
        }

        label::before {

            content: "> ";

            color: var(--green);
        }

        input {

            width: 100%;

            padding: 12px 13px;

            margin-bottom: 16px;

            background: #050806;

            border: 1px solid #1a2b20;

            color: var(--text);

            outline: none;

            border-radius: 0;

            font-family: inherit;

            font-size: 13px;

            transition: 0.2s;
        }

        input::placeholder {

            color: #3d4c44;
        }

        input:focus {

            border-color: var(--green-dark);

            box-shadow:
                0 0 15px rgba(57,255,136,0.05);
        }

        button {

            width: 100%;

            padding: 13px;

            margin-top: 6px;

            border: 1px solid #255437;

            background:
                linear-gradient(
                    90deg,
                    #0b1b11,
                    #102719
                );

            color: var(--green);

            font-family: inherit;

            font-size: 12px;

            font-weight: bold;

            letter-spacing: 2px;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {

            border-color: var(--green);

            box-shadow:
                0 0 18px rgba(57,255,136,0.12);
        }

        button:disabled {

            opacity: 0.45;

            cursor: not-allowed;
        }

        .login-link {

            text-align: center;

            margin-top: 20px;

            padding-top: 17px;

            border-top: 1px solid #101b14;

            color: #56635b;

            font-size: 10px;
        }

        .login-link a {

            color: var(--green);

            text-decoration: none;

            margin-left: 5px;
        }

        .message {

            min-height: 18px;

            margin-top: 14px;

            text-align: center;

            font-size: 10px;

            line-height: 1.5;
        }

        .error {

            color: var(--danger);
        }

        .success {

            color: var(--green);

        }

        .footer {

            position: fixed;

            bottom: 15px;

            width: 100%;

            text-align: center;

            color: #26332b;

            font-size: 9px;

            letter-spacing: 2px;
        }

        @media (max-width: 500px) {

            .register-container {
                padding: 24px;
            }

        }

    </style>

</head>

<body>

<div class="register-container">

    <div class="system-label">
        [ NEW IDENTITY PROTOCOL ]
    </div>

    <div class="title">

        <h1>
            INITIALIZE<span>//</span>NODE
        </h1>

        <p>
            CREATE LOCAL COMMUNICATION IDENTITY
        </p>

    </div>


    <div class="progress">
        <span></span>
    </div>


    <form id="registerForm">

        <label for="phone">
            Node Identifier
        </label>

        <input
            type="text"
            id="phone"
            placeholder="01011111111"
            maxlength="11"
            autocomplete="tel"
            required
        >


        <label for="password">
            Access Key
        </label>

        <input
            type="password"
            id="password"
            placeholder="Minimum 6 characters"
            minlength="6"
            autocomplete="new-password"
            required
        >


        <label for="confirmPassword">
            Confirm Access Key
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Repeat access key"
            minlength="6"
            autocomplete="new-password"
            required
        >


        <button
            type="submit"
            id="registerButton"
        >
            [ INITIALIZE IDENTITY ]
        </button>

    </form>


    <div class="login-link">

        EXISTING NODE?

        <a href="/login">
            AUTHENTICATE
        </a>

    </div>


    <div
        id="message"
        class="message"
    ></div>

</div>


<div class="footer">
    LAN//NODE &nbsp;•&nbsp; IDENTITY REGISTRATION PROTOCOL
</div>


<script>

    const registerForm =
        document.getElementById(
            "registerForm"
        );

    const messageBox =
        document.getElementById(
            "message"
        );

    const registerButton =
        document.getElementById(
            "registerButton"
        );


    registerForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const phone =
                document
                .getElementById("phone")
                .value
                .trim();


            const password =
                document
                .getElementById("password")
                .value;


            const confirmPassword =
                document
                .getElementById(
                    "confirmPassword"
                )
                .value;


            if (
                password !==
                confirmPassword
            ) {

                messageBox.textContent =
                    "> ERROR // access keys do not match";

                messageBox.className =
                    "message error";

                return;

            }


            if (
                password.length < 6
            ) {

                messageBox.textContent =
                    "> ERROR // access key too short";

                messageBox.className =
                    "message error";

                return;

            }


            const phoneRegex =
                /^01[0125][0-9]{8}$/;


            if (
                !phoneRegex.test(phone)
            ) {

                messageBox.textContent =
                    "> ERROR // invalid node identifier";

                messageBox.className =
                    "message error";

                return;

            }


            registerButton.disabled =
                true;

            registerButton.textContent =
                "[ INITIALIZING... ]";


            messageBox.textContent =
                "> generating local identity...";

            messageBox.className =
                "message";


            try {

                const response =
                    await fetch(
                        "/api/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    phone:
                                        phone,

                                    password:
                                        password
                                })
                        }
                    );


                const data =
                    await response.json();


                if (
                    response.ok &&
                    data.success
                ) {

                    messageBox.textContent =
                        "> IDENTITY CREATED // redirecting...";

                    messageBox.className =
                        "message success";


                    registerForm.reset();


                    setTimeout(
                        function() {

                            window.location.href =
                                "/login";

                        },
                        1200
                    );

                } else {

                    messageBox.textContent =
                        "> ERROR // " +
                        (
                            data.message ||
                            "identity creation failed"
                        );

                    messageBox.className =
                        "message error";


                    registerButton.disabled =
                        false;

                    registerButton.textContent =
                        "[ INITIALIZE IDENTITY ]";

                }


            } catch (error) {

                messageBox.textContent =
                    "> CONNECTION ERROR // NODE UNREACHABLE";

                messageBox.className =
                    "message error";


                registerButton.disabled =
                    false;

                registerButton.textContent =
                    "[ INITIALIZE IDENTITY ]";

            }

        }
    );

</script>

</body>

</html>
