<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LAN//NODE - Authentication</title>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #050706;
            --panel: #090c0a;
            --panel-2: #0d120f;
            --border: #1b3325;
            --green: #39ff88;
            --green-dark: #123d25;
            --text: #d8e7dc;
            --muted: #718078;
            --danger: #ff4d6d;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {

            margin: 0;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

            overflow: hidden;

            font-family:
                "Courier New",
                Consolas,
                monospace;

            background:
                radial-gradient(
                    circle at center,
                    #0b1710 0%,
                    #050706 45%,
                    #020302 100%
                );

            color: var(--text);
        }

        /* =========================================
           BACKGROUND GRID
        ========================================= */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background-image:
                linear-gradient(
                    rgba(57,255,136,0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(57,255,136,0.025) 1px,
                    transparent 1px
                );

            background-size: 40px 40px;

            mask-image:
                radial-gradient(
                    circle,
                    black 20%,
                    transparent 85%
                );
        }

        /* =========================================
           SCANLINES
        ========================================= */

        body::after {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(255,255,255,0.015),
                    rgba(255,255,255,0.015) 1px,
                    transparent 1px,
                    transparent 4px
                );

            opacity: 0.35;
        }

        /* =========================================
           LOGIN CONTAINER
        ========================================= */

        .login-container {

            position: relative;

            width: 410px;

            max-width: calc(100% - 30px);

            padding: 34px;

            background:
                linear-gradient(
                    145deg,
                    rgba(12,20,15,0.98),
                    rgba(4,7,5,0.98)
                );

            border: 1px solid var(--border);

            box-shadow:
                0 0 0 1px rgba(57,255,136,0.025),
                0 0 35px rgba(0,255,100,0.08),
                0 25px 80px rgba(0,0,0,0.7);
        }

        .login-container::before {

            content: "";

            position: absolute;

            top: -1px;
            left: 25px;

            width: 80px;

            height: 2px;

            background: var(--green);

            box-shadow:
                0 0 12px var(--green);
        }

        .login-container::after {

            content: "NODE_AUTH // SECURE";

            position: absolute;

            right: 15px;

            top: -9px;

            padding: 0 7px;

            font-size: 9px;

            letter-spacing: 1px;

            color: var(--green);

            background: var(--bg);
        }

        /* =========================================
           HEADER
        ========================================= */

        .title {

            margin-bottom: 32px;
        }

        .system-label {

            color: var(--green);

            font-size: 11px;

            letter-spacing: 3px;

            margin-bottom: 14px;

            opacity: 0.8;
        }

        .title h1 {

            margin: 0;

            font-size: 32px;

            letter-spacing: 2px;

            color: #ecfff2;

            font-weight: 700;

            text-shadow:
                0 0 15px rgba(57,255,136,0.15);
        }

        .title h1 span {

            color: var(--green);

        }

        .title p {

            margin: 9px 0 0;

            color: var(--muted);

            font-size: 12px;

            letter-spacing: 1px;
        }

        .cursor {

            display: inline-block;

            width: 7px;

            height: 14px;

            margin-left: 5px;

            background: var(--green);

            vertical-align: middle;

            animation: blink 1s infinite;
        }

        @keyframes blink {

            0%,
            45% {
                opacity: 1;
            }

            46%,
            100% {
                opacity: 0;
            }
        }

        /* =========================================
           TERMINAL STATUS
        ========================================= */

        .system-status {

            display: flex;

            justify-content: space-between;

            padding: 9px 11px;

            margin-bottom: 24px;

            background: #060a07;

            border: 1px solid #122319;

            font-size: 10px;

            color: var(--muted);

            letter-spacing: 0.5px;
        }

        .status-online {

            color: var(--green);

            text-shadow:
                0 0 8px rgba(57,255,136,0.5);
        }

        /* =========================================
           FORM
        ========================================= */

        label {

            display: block;

            margin-bottom: 8px;

            color: #8ea095;

            font-size: 11px;

            letter-spacing: 1px;

            text-transform: uppercase;
        }

        label::before {

            content: "> ";

            color: var(--green);
        }

        input {

            width: 100%;

            padding: 13px 14px;

            margin-bottom: 19px;

            color: var(--text);

            background: #050806;

            border: 1px solid #1a2b20;

            outline: none;

            border-radius: 0;

            font-family: inherit;

            font-size: 14px;

            transition: 0.2s;
        }

        input::placeholder {

            color: #3d4c44;
        }

        input:focus {

            border-color: var(--green-dark);

            box-shadow:
                0 0 0 1px rgba(57,255,136,0.08),
                0 0 15px rgba(57,255,136,0.05);

            background: #070c08;
        }

        /* =========================================
           BUTTON
        ========================================= */

        button {

            position: relative;

            width: 100%;

            padding: 13px;

            margin-top: 5px;

            border: 1px solid #255437;

            border-radius: 0;

            background:
                linear-gradient(
                    90deg,
                    #0b1b11,
                    #102719
                );

            color: var(--green);

            font-family: inherit;

            font-size: 13px;

            font-weight: bold;

            letter-spacing: 2px;

            cursor: pointer;

            transition: 0.2s;

            overflow: hidden;
        }

        button::before {

            content: "";

            position: absolute;

            top: 0;

            left: -100%;

            width: 100%;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(57,255,136,0.12),
                    transparent
                );

            transition: 0.5s;
        }

        button:hover {

            border-color: var(--green);

            box-shadow:
                0 0 18px rgba(57,255,136,0.12);

            background: #0d2114;
        }

        button:hover::before {

            left: 100%;
        }

        /* =========================================
           REGISTER
        ========================================= */

        .register-link {

            text-align: center;

            margin-top: 24px;

            padding-top: 18px;

            border-top: 1px solid #101b14;

            font-size: 11px;

            color: #56635b;
        }

        .register-link a {

            color: var(--green);

            text-decoration: none;

            margin-left: 5px;
        }

        .register-link a:hover {

            text-shadow:
                0 0 10px rgba(57,255,136,0.5);
        }

        /* =========================================
           MESSAGE
        ========================================= */

        .message {

            min-height: 18px;

            margin-top: 15px;

            text-align: center;

            font-size: 11px;

            letter-spacing: 0.4px;
        }

        .error {

            color: var(--danger);

            text-shadow:
                0 0 8px rgba(255,77,109,0.2);
        }

        .success {

            color: var(--green);

            text-shadow:
                0 0 8px rgba(57,255,136,0.25);
        }

        /* =========================================
           FOOTER
        ========================================= */

        .footer {

            position: fixed;

            bottom: 15px;

            left: 0;

            width: 100%;

            text-align: center;

            color: #26332b;

            font-size: 9px;

            letter-spacing: 2px;
        }

        @media (max-width: 500px) {

            .login-container {

                padding: 25px;

            }

            .title h1 {

                font-size: 26px;

            }

        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="title">

        <div class="system-label">
            [ PRIVATE NETWORK ]
        </div>

        <h1>
            LAN<span>//</span>NODE
        </h1>

        <p>
            SECURE COMMUNICATION TERMINAL
            <span class="cursor"></span>
        </p>

    </div>


    <div class="system-status">

        <span>
            NETWORK: LOCAL
        </span>

        <span class="status-online">
            ● ONLINE
        </span>

    </div>


    <form id="loginForm">

        <label for="phone">
            Node Identifier
        </label>

        <input
            type="text"
            id="phone"
            placeholder="01011111111"
            maxlength="11"
            autocomplete="username"
            required
        >


        <label for="password">
            Access Key
        </label>

        <input
            type="password"
            id="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
        >


        <button type="submit">
            [ AUTHENTICATE ]
        </button>

    </form>


    <div class="register-link">

        NO IDENTITY FOUND?

        <a href="/register">
            INITIALIZE NEW NODE
        </a>

    </div>


    <div
        id="message"
        class="message"
    ></div>

</div>


<div class="footer">
    LAN//NODE &nbsp;•&nbsp; LOCAL SECURE NETWORK
</div>


<script>

    const loginForm =
        document.getElementById("loginForm");

    const messageBox =
        document.getElementById("message");


    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const phone =
                document
                .getElementById("phone")
                .value
                .trim();


            const password =
                document
                .getElementById("password")
                .value;


            messageBox.textContent =
                "> authenticating node...";

            messageBox.className =
                "message";


            try {

                const response =
                    await fetch(
                        "/api/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                phone: phone,
                                password: password
                            })
                        }
                    );


                const data =
                    await response.json();


                if (data.success) {

                    messageBox.textContent =
                        "> ACCESS GRANTED // opening secure channel...";

                    messageBox.className =
                        "message success";


                    setTimeout(
                        function() {

                            window.location.href =
                                "/chat";

                        },
                        500
                    );

                } else {

                    messageBox.textContent =
                        "> ACCESS DENIED // " +
                        (
                            data.message ||
                            "authentication failed"
                        );

                    messageBox.className =
                        "message error";

                }


            } catch (error) {

                messageBox.textContent =
                    "> CONNECTION ERROR // NODE UNREACHABLE";

                messageBox.className =
                    "message error";

            }

        }
    );

</script>

</body>

</html>
